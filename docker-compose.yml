version: '3.8'

services:
  config_generator_app:
    build: .
    container_name: config_generator_app
    restart: unless-stopped
    ports:
      - "8095:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////app/mining_history.db
      - JWT_SECRET=super-secret-mining-key-saas-unitv-2026-auth-token-key-32b
    volumes:
      - ./mining_history.db:/app/mining_history.db
      - ./configs:/app/configs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

